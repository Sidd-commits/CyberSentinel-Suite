w<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #060d1a;
      color: #e2e8f0;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: #0d1b2e;
      border-bottom: 1px solid #1e3a5f;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-size: 13px; font-weight: 700; color: #3b82f6; display: flex; align-items: center; gap: 7px; }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      transition: background 0.3s;
    }
    .conn-dot.online  { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .conn-dot.offline { background: #ef4444; }
    .conn-dot.checking { background: #f59e0b; animation: blink .7s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    .conn-label { font-size: 10px; color: #64748b; }

    /* ── URL Box ── */
    .url-section { padding: 12px 14px 0; }
    .url-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px; }
    .url-box {
      background: #0d1b2e;
      border: 1px solid #1e3a5f;
      border-radius: 7px;
      padding: 9px 11px;
      font-size: 11px;
      color: #93c5fd;
      word-break: break-all;
      line-height: 1.5;
      min-height: 36px;
      max-height: 60px;
      overflow-y: auto;
    }

    /* ── Result Card ── */
    .result {
      margin: 10px 14px 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      display: none;
      border: 1px solid;
      animation: pop .2s ease;
    }
    @keyframes pop { from { opacity:0; transform:scale(.97); } to { opacity:1; transform:scale(1); } }
    .result.safe       { background: #052e16; border-color: #166534; color: #4ade80; }
    .result.phishing   { background: #450a0a; border-color: #991b1b; color: #fca5a5; }
    .result.suspicious { background: #422006; border-color: #92400e; color: #fde68a; }
    .result.error      { background: #1e293b; border-color: #334155; color: #94a3b8; }
    .result-icon { font-size: 1.2rem; margin-right: 6px; }
    .result-title { font-weight: 700; font-size: 12px; }
    .result-score { font-size: 11px; opacity: .8; margin-top: 3px; }
    .result-reasons { margin-top: 7px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 6px; }
    .result-reasons div { font-size: 10px; opacity: .85; padding: 2px 0; display: flex; align-items: flex-start; gap: 5px; }
    .result-reasons div::before { content: '›'; flex-shrink: 0; font-weight: 700; }

    /* ── Queue Banner ── */
    .queue-banner {
      margin: 8px 14px 0;
      background: #422006;
      border: 1px solid #92400e;
      border-radius: 7px;
      padding: 7px 11px;
      font-size: 11px;
      color: #fde68a;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .queue-banner.visible { display: flex; }
    .flush-btn {
      background: #92400e; color: #fde68a; border: none;
      border-radius: 5px; padding: 3px 8px; font-size: 10px;
      cursor: pointer; font-weight: 600; white-space: nowrap;
    }
    .flush-btn:hover { background: #b45309; }

    /* ── Buttons ── */
    .actions { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 7px; }
    .btn {
      width: 100%; padding: 10px 14px; border: none; border-radius: 8px;
      cursor: pointer; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: all .2s;
    }
    .btn-primary  { background: #3b82f6; color: #fff; }
    .btn-primary:hover  { background: #2563eb; }
    .btn-primary:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }
    .btn-secondary { background: #132338; color: #94a3b8; border: 1px solid #1e3a5f; }
    .btn-secondary:hover { background: #1a2f45; color: #e2e8f0; }

    /* ── Spinner ── */
    .spin {
      width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: sp .6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid #0d1b2e;
      padding: 7px 14px;
      font-size: 10px;
      color: #1e3a5f;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">🛡️ Phishing Detector</div>
  <div style="display:flex;align-items:center;gap:6px">
    <div class="conn-dot checking" id="connDot"></div>
    <span class="conn-label" id="connLabel">Connecting…</span>
  </div>
</div>

<div class="url-section">
  <div class="url-label">Current Tab</div>
  <div class="url-box" id="urlBox">Loading…</div>
</div>

<div class="result" id="result">
  <div style="display:flex;align-items:center">
    <span class="result-icon" id="rIcon"></span>
    <div>
      <div class="result-title" id="rTitle"></div>
      <div class="result-score" id="rScore"></div>
    </div>
  </div>
  <div class="result-reasons" id="rReasons"></div>
</div>

<div class="queue-banner" id="queueBanner">
  <span id="queueText">⚠️ URLs queued (dashboard offline)</span>
  <button class="flush-btn" id="flushBtn">Retry Now</button>
</div>

<div class="actions">
  <button class="btn btn-primary" id="checkBtn" disabled>
    🔍 Check This URL
  </button>
  <button class="btn btn-secondary" id="dashBtn">
    📊 Open Dashboard
  </button>
</div>

<div class="footer">
  <span>localhost:5000</span>
  <span id="footerStatus">—</span>
</div>

<script src="popup.js"></script>
</body>
</html>
